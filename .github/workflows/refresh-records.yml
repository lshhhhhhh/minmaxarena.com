name: Refresh records

# The records in this repository are a snapshot, and a stale snapshot is worse
# than none: somebody reads it, believes it, and cites a value that moved
# months ago. So it refreshes itself daily from the site's public API — the
# same URLs anybody can fetch, no token, no access to anything private.
#
# The verifiers under src/ are not touched here. They change only when a
# problem is added, and that is pushed from the site's own repository.
on:
  schedule:
    - cron: "27 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/refresh-records.mjs
      - name: Commit whatever moved
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "nothing moved today"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add records README.md
          git commit -m "Records as of $(date -u +%Y-%m-%d)"
          git push
